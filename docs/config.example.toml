# A subset of the keys. crates/webpilot/src/settings.rs lists every key, its
# default and the WEBPILOT_* variable that overrides it.

[timeouts]
navigation_ms = 15000
download_window_ms = 2000

[chrome]
accept_dialogs = false
viewport_width = 1280
viewport_height = 720
no_sandbox = false

[capture]
max_elements = 1000
screenshot_max_long_edge = 1568

[cdp]
event_buffer = 512

[artifacts]
ttl_secs = 604800
