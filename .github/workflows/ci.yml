name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: lint

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: test-${{ matrix.os }}

      - name: cargo build
        run: cargo build --workspace --locked --all-targets

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: e2e

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: cargo test --test e2e_headless
        env:
          WEBPILOT_E2E: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo test -p webpilot-cli --locked --test e2e_headless -- --nocapture

      - name: cargo test --test e2e_browser
        env:
          WEBPILOT_E2E_BROWSER: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo test -p webpilot-cli --locked --test e2e_browser -- --nocapture
