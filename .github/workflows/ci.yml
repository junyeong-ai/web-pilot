name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this same suite as its publish gate, so the gate
  # definition lives in exactly one place and cannot drift from CI.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (defaults to the triggering SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Static group prefix, never `${{ github.workflow }}`: inside a workflow_call
# that context resolves to the CALLER's name, which would land the release
# gate in a group adjacent to the release run's own and inherit the wrong
# cancellation semantics (GitHub's documented reusable-workflow guidance).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: lint

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: test-${{ matrix.os }}

      - name: cargo build
        run: cargo build --workspace --locked --all-targets

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      # The toolchain file pins what CI BUILDS with, which is free to move ahead
      # of the oldest release the crates claim to support. Read `rust-version`
      # from the workspace manifest and check against exactly that, so the claim
      # is a gate rather than a comment.
      - id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv

      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: e2e

      # WebPilot targets Chrome for Testing: the browser-mode e2e loads the
      # unpacked extension, which branded Chrome no longer allows. setup-chrome
      # pulls in the system libraries Chrome needs on a headless runner; the
      # @puppeteer/browsers install then fetches the matching Chrome for Testing
      # binary the tests run against.
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Install Chrome for Testing
        id: chrome
        run: |
          set -euo pipefail
          out="$(npx --yes @puppeteer/browsers install chrome@stable)"
          # `install` prints "chrome@<version> <path>"; take the path.
          echo "path=${out##* }" >> "$GITHUB_OUTPUT"

      - name: cargo test --test e2e_headless
        env:
          WEBPILOT_E2E: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.path }}
          # The runner is an unprivileged container — Chrome's setuid sandbox
          # can't initialise there, so opt into --no-sandbox for CI only.
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_headless -- --nocapture

      - name: cargo test --test e2e_browser
        env:
          WEBPILOT_E2E_BROWSER: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.path }}
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_browser -- --nocapture
