name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this same suite as its publish gate, so the gate
  # definition lives in exactly one place and cannot drift from CI.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (defaults to the triggering SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Static group prefix, never `${{ github.workflow }}`: inside a workflow_call
# that context resolves to the CALLER's name, which would land the release
# gate in a group adjacent to the release run's own and inherit the wrong
# cancellation semantics (GitHub's documented reusable-workflow guidance).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: lint

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: test-${{ matrix.os }}

      - name: cargo build
        run: cargo build --workspace --locked --all-targets

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: e2e

      # WebPilot targets Chrome for Testing: the browser-mode e2e loads the
      # unpacked extension, which branded Chrome no longer allows. setup-chrome
      # pulls in the system libraries Chrome needs on a headless runner; the
      # @puppeteer/browsers install then fetches the matching Chrome for Testing
      # binary the tests run against.
      - uses: browser-actions/setup-chrome@v2

      - name: Install Chrome for Testing
        id: chrome
        run: |
          set -euo pipefail
          out="$(npx --yes @puppeteer/browsers install chrome@stable)"
          # `install` prints "chrome@<version> <path>"; take the path.
          echo "path=${out##* }" >> "$GITHUB_OUTPUT"

      - name: cargo test --test e2e_headless
        env:
          WEBPILOT_E2E: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.path }}
          # The runner is an unprivileged container — Chrome's setuid sandbox
          # can't initialise there, so opt into --no-sandbox for CI only.
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_headless -- --nocapture

      - name: cargo test --test e2e_browser
        env:
          WEBPILOT_E2E_BROWSER: "1"
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.path }}
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_browser -- --nocapture
