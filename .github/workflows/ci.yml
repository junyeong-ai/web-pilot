name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this same suite as its publish gate, so the gate
  # definition lives in exactly one place and cannot drift from CI.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (defaults to the triggering SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Static group prefix, never `${{ github.workflow }}`: inside a workflow_call
# that context resolves to the CALLER's name, which would land the release
# gate in a group adjacent to the release run's own and inherit the wrong
# cancellation semantics (GitHub's documented reusable-workflow guidance).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: lint

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: oxlint (extension)
        run: npm run lint

      # The install/uninstall scripts are the other half no Rust gate sees, and
      # they run as the first thing on a user's machine — before any binary this
      # workflow tests exists. shellcheck ships on the runner image.
      - name: shellcheck (scripts)
        run: shellcheck scripts/*.sh

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: test-${{ matrix.os }}

      - name: cargo build
        run: cargo build --workspace --locked --all-targets

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      # The toolchain file pins what CI BUILDS with, which is free to move ahead
      # of the oldest release the crates claim to support. Read `rust-version`
      # from the workspace manifest and check against exactly that, so the claim
      # is a gate rather than a comment.
      - id: msrv
        run: |
          set -euo pipefail
          # Every workspace crate must agree, or the gate would check whichever
          # one `cargo metadata` happened to list first.
          declared="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(*sorted({p["rust_version"] for p in json.load(sys.stdin)["packages"]}))')"
          if [ "$(printf %s "$declared" | wc -w)" -ne 1 ]; then
            echo "workspace crates declare different rust-version: $declared" >&2
            exit 1
          fi
          echo "version=${declared}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv

      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" check --workspace --locked

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: e2e

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: 156.0.8078.47
          install-dependencies: true

      - name: cargo test --test e2e_headless
        env:
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # The runner is an unprivileged container — Chrome's setuid sandbox
          # can't initialise there, so opt into --no-sandbox for CI only.
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_headless -- --ignored --nocapture

      # The long-lived transport: `webpilot mcp` serves a whole session over one
      # transport while Chrome outlives it, so state a CLI process re-establishes
      # at every launch can go stale under it.
      - name: cargo test --test e2e_mcp
        env:
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_mcp -- --ignored --nocapture

      - name: cargo test --test e2e_browser
        env:
          WEBPILOT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          WEBPILOT_CHROME_NO_SANDBOX: "1"
        run: cargo test -p webpilot-cli --locked --test e2e_browser -- --ignored --nocapture
