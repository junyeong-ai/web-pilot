[workspace]
resolver = "2"
members = ["crates/webpilot", "crates/webpilot-cli"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"

[workspace.dependencies]
# Async runtime — feature-trimmed (no `process`/`signal`: a global SIGCHLD reaper
# would race the std::process `ps`/`which` subprocess calls in session.rs; Chrome
# is reaped via an explicit non-blocking `waitpid` task instead).
# `io-std` powers the MCP server's async stdin/stdout JSON-RPC loop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# Image (screenshot processing)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6"
base64 = "0.22"

# SHA-256 — derives the Chrome extension id from the manifest's pinned public
# key (the same algorithm Chrome uses), so `setup` can authorise the NM host
# without the user copying the id out of chrome://extensions.
sha2 = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error
anyhow = "1"
thiserror = "2"
similar = "3"

# WebSocket (CDP)
tokio-tungstenite = "0.29"

# Unix syscalls
libc = "0.2"

# Compile-time embedded assets (Claude skill + Chrome extension)
include_dir = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = "line-tables-only"
